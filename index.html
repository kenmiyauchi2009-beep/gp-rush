<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GPラッシュ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>GPラッシュ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="cv" aria-label="レースの画面。左半分を押すと左、右半分を押すと右に曲がる。両方でブレーキ"></canvas>

  <!-- 押している側の印 -->
  <div class="pad left" id="padL" aria-hidden="true"></div>
  <div class="pad right" id="padR" aria-hidden="true"></div>

  <!-- レース中の表示 -->
  <div id="hud" class="hidden">
    <button class="icob" id="pauseBtn" aria-label="一時停止">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="laps">
      <div class="posno" id="hPosBox"><small>POS</small><b id="hPos">-</b><small id="hPosOf"></small></div>
      <div class="lapno"><small>LAP</small><b id="hLap">1</b><small id="hLapOf"></small></div>
      <div class="times">
        <div class="now" id="hTime">0:00.000</div>
        <div class="sub"><span>ベスト</span><b id="hBest">-:--.---</b></div>
        <div class="sub"><span>前の周</span><b id="hLast">-:--.---</b></div>
      </div>
    </div>
    <canvas id="map" aria-hidden="true"></canvas>
    <div class="speedo">
      <div class="leds" id="hLeds"></div>
      <div class="row">
        <div class="gear"><small>GEAR</small><b id="hGear">N</b></div>
        <div class="spd"><b id="hSpd">0</b><small>km/h</small></div>
        <div class="tyre" id="hTyre"><i id="hTyreC">M</i><small id="hWear">100%</small></div>
      </div>
    </div>
    <div class="gaps" id="hGaps"><span>前 <b id="hAhead">-</b></span><span>後 <b id="hBehind">-</b></span></div>
    <div class="delta" id="hDelta"></div>
    <div class="banner hidden" id="banner"></div>
    <div class="hint" id="hHint">左右を押して曲がる・両方でブレーキ</div>
    <div class="pitbox" id="pitBox">
      <button class="pitb" id="pitBtn" aria-label="ピットイン">PIT</button>
      <div class="pitmenu hidden" id="pitMenu"></div>
    </div>
    <div class="wx" id="hWx"></div>
  </div>

  <!-- タイトル -->
  <div id="title">
    <div class="ticons">
      <button class="icob2" id="achBtn" aria-label="実績と記録"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 13h4v3h-4zM8 18h8v2H8z"/></svg><span class="badge" id="achBadge"></span></button>
      <button class="icob2" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.6 5-1.8-.4a7 7 0 0 1-.7 1.7l1 1.6-1.9 1.9-1.6-1a7 7 0 0 1-1.7.7l-.4 1.8h-2.6l-.4-1.8a7 7 0 0 1-1.7-.7l-1.6 1-1.9-1.9 1-1.6a7 7 0 0 1-.7-1.7l-1.8-.4v-2.6l1.8-.4a7 7 0 0 1 .7-1.7l-1-1.6 1.9-1.9 1.6 1a7 7 0 0 1 1.7-.7l.4-1.8h2.6l.4 1.8a7 7 0 0 1 1.7.7l1.6-1 1.9 1.9-1 1.6a7 7 0 0 1 .7 1.7l1.8.4z" fill-rule="evenodd"/></svg></button>
    </div>
    <div class="resume hidden" id="resumeBox">
      <span id="resumeTxt"></span>
      <button class="primary" id="resumeGo">続きから</button>
      <button id="resumeNo">やめる</button>
    </div>
    <div class="tlogo"><h1>GP<span>ラッシュ</span></h1><p>タップで走る、架空のグランプリ</p></div>
    <div class="tmenu">
      <button class="primary" id="seasonBtn">シーズン<small id="seasonSub"></small></button>
      <button id="quickBtn">クイックレース<small>サーキットを選ぶ</small></button>
      <button id="practiceBtn">練習走行<small>1人で走る</small></button>
      <button id="garageBtn">ガレージ<small id="garageSub"></small></button>
    </div>
    <div class="trow">
      <div class="diff" id="diffSel" role="radiogroup" aria-label="ライバルの強さ"></div>
      <div class="diff" id="lapSel" role="radiogroup" aria-label="レースの周回数"></div>
    </div>
    <div class="tver" id="titleVer"></div>
    <div class="tcirc" id="titleCirc"></div>
  </div>

  <!-- 一時停止 -->
  <div id="pause" class="hidden">
    <div class="sheet">
      <h2>一時停止</h2>
      <button class="primary" id="resumeBtn">続ける</button>
      <button id="restartBtn">最初からやり直す</button>
      <button id="soundBtn" aria-pressed="true">音：ON</button>
      <button id="bgmBtn" aria-pressed="true">BGM：ON</button>
      <button id="quitBtn">タイトルへ</button>
      <p class="offl" id="offlStatus"></p>
    </div>
  </div>

  <!-- レース結果 -->
  <div id="results" class="hidden">
    <div class="sheet wide">
      <h2 id="rTitle">レース結果</h2>
      <p class="rsum" id="rSummary"></p>
      <div class="rtable" id="rTable"></div>
      <div class="rbtns" id="rBtns"></div>
    </div>
  </div>

  <!-- メニュー（シーズン・サーキット選び・順位表・予選の結果） -->
  <div id="menu" class="hidden"><div class="sheet wide" id="menuSheet"></div></div>

  <div id="toast" role="status"></div>
</div>

<!-- 縦持ちのとき -->
<div id="rotate">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M50 40a18 18 0 0 1-14 14" fill="none" stroke="currentColor" stroke-width="3"/><path d="M36 50l0 5 5 0" fill="none" stroke="currentColor" stroke-width="3"/></svg>
  <p>iPhone を横向きにしてください</p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
